apiVersion: v1
kind: ServiceAccount
metadata:
  name: guidellm-benchmark-sa
  namespace: guidellm-nightly
  labels:
    app.kubernetes.io/name: guidellm-benchmark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guidellm-benchmark-role
  namespace: guidellm-nightly
  labels:
    app.kubernetes.io/name: guidellm-benchmark
rules:
  # Read ConfigMaps for redeployment and cleanup YAMLs
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Manage model serving resources (InferenceService, ServingRuntime)
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage Deployments (if model is deployed as a plain Deployment)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Check pod status for readiness
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guidellm-benchmark-binding
  namespace: guidellm-nightly
  labels:
    app.kubernetes.io/name: guidellm-benchmark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guidellm-benchmark-role
subjects:
  - kind: ServiceAccount
    name: guidellm-benchmark-sa
    namespace: guidellm-nightly

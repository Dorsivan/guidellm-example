          parameterType: STRING
        pipelinechannel--redeploy_configmaps:
          parameterType: STRING
        pipelinechannel--setup-run-deadline_epoch:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--setup-run-run_id:
          parameterType: STRING
        pipelinechannel--test_configs:
          parameterType: STRING

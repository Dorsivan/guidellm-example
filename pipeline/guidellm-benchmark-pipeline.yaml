deploymentSpec:
  executors:
    exec-finalize-run:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - finalize_run
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubernetes>=28.0.0'\
          \ 'pyyaml>=6.0'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef finalize_run(\n    namespace: str,\n    cleanup_configmap: str,\n\
          \    pvc_name: str,\n    final_report: dsl.Output[dsl.Markdown],\n) -> str:\n\
          \    \"\"\"Generate a final Markdown report and optionally clean up the\
          \ model.\"\"\"\n    import glob\n    import json\n    import os\n    from\
          \ datetime import datetime, timezone\n\n    results_dir = \"/mnt/results\"\
          \n\n    # Find the most recent run directory (by name, which is a timestamp)\n\
          \    run_dirs = sorted(glob.glob(f\"{results_dir}/*/metadata.json\"), reverse=True)\n\
          \    if run_dirs:\n        run_dir = os.path.dirname(run_dirs[0])\n    \
          \    with open(run_dirs[0]) as f:\n            metadata = json.load(f)\n\
          \    else:\n        metadata = {\n            \"run_id\": \"unknown\", \"\
          test_configs\": [], \"total_tests\": 0,\n            \"start_time\": \"\
          ?\", \"timeout_minutes\": \"?\",\n        }\n        run_dir = results_dir\n\
          \n    run_id = metadata.get(\"run_id\", \"unknown\")\n    test_configs =\
          \ metadata.get(\"test_configs\", [])\n\n    # Read all status files\n  \
          \  tests = []\n    status_dir = f\"{run_dir}/status\"\n    for i in range(len(test_configs)):\n\
          \        status_path = f\"{status_dir}/test_{i}.json\"\n        if os.path.exists(status_path):\n\
          \            with open(status_path) as f:\n                tests.append(json.load(f))\n\
          \        else:\n            tests.append({\n                \"index\": i,\n\
          \                \"name\": test_configs[i].get(\"name\", f\"test-{i:02d}\"\
          ),\n                \"config\": test_configs[i],\n                \"status\"\
          : \"crashed\",\n                \"reason\": \"no status file (step may have\
          \ been killed)\",\n            })\n\n    redeploys = []\n    for i in range(max(len(test_configs)\
          \ - 1, 0)):\n        status_path = f\"{status_dir}/redeploy_{i}.json\"\n\
          \        if os.path.exists(status_path):\n            with open(status_path)\
          \ as f:\n                redeploys.append(json.load(f))\n\n    completed\
          \ = [t for t in tests if t.get(\"status\") == \"completed\"]\n    failed\
          \ = [t for t in tests if t.get(\"status\") == \"failed\"]\n    skipped =\
          \ [t for t in tests if t.get(\"status\") == \"skipped\"]\n    crashed =\
          \ [t for t in tests if t.get(\"status\") == \"crashed\"]\n\n    # Compute\
          \ total duration from metadata start_time to now\n    total_duration = \"\
          ?\"\n    try:\n        start = datetime.fromisoformat(metadata[\"start_time\"\
          ])\n        total_duration = f\"{(datetime.now(timezone.utc) - start).total_seconds():.0f}\"\
          \n    except Exception:\n        pass\n\n    timed_out = any(\n        t.get(\"\
          reason\") == \"timeout\" for t in skipped\n    )\n\n    # ---- Build Markdown\
          \ report ----------------------------------------\n\n    lines = [\n   \
          \     f\"# GuideLLM Benchmark Report: {run_id}\\n\",\n        f\"**Model:**\
          \ `{test_configs[0].get('name', '?') if test_configs else '?'}`  \",\n \
          \       f\"**Started:** {metadata.get('start_time', '?')}  \",\n       \
          \ f\"**Duration:** {total_duration}s  \",\n        f\"**Timeout budget:**\
          \ {metadata.get('timeout_minutes', '?')} min  \",\n        f\"**Timed out:**\
          \ {'Yes' if timed_out else 'No'}  \",\n        f\"**Completed:** {len(completed)}\
          \ | **Failed:** {len(failed)} \"\n        f\"| **Skipped:** {len(skipped)}\
          \ | **Crashed:** {len(crashed)}  \",\n        \"\",\n    ]\n\n    # Summary\
          \ table\n    if tests:\n        lines.extend([\n            \"## Test Summary\\\
          n\",\n            \"| # | Name | Tokens (in/out) | Profile | Status | Duration\
          \ \"\n            \"| Throughput (tok/s) | Latency p99 (s) | TTFT p99 (s)\
          \ |\",\n            \"|---|------|-----------------|---------|--------|----------\"\
          \n            \"|--------------------|-----------------|--------------|\"\
          ,\n        ])\n        for t in tests:\n            tc = t.get(\"config\"\
          , {})\n            tokens = f\"{tc.get('prompt_tokens', '?')}/{tc.get('output_tokens',\
          \ '?')}\"\n            prof = tc.get(\"profile\", \"sweep\")\n         \
          \   dur = f\"{t['duration_seconds']:.0f}s\" if t.get(\"duration_seconds\"\
          ) else \"-\"\n\n            throughput = latency_p99 = ttft_p99 = \"-\"\n\
          \            for _, sm in t.get(\"metrics\", {}).items():\n            \
          \    if sm.get(\"total_tokens_per_second\") is not None:\n             \
          \       throughput = f\"{sm['total_tokens_per_second']:.1f}\"\n        \
          \        if sm.get(\"request_latency_seconds_p99\") is not None:\n     \
          \               latency_p99 = f\"{sm['request_latency_seconds_p99']:.3f}\"\
          \n                if sm.get(\"time_to_first_token_seconds_p99\") is not\
          \ None:\n                    ttft_p99 = f\"{sm['time_to_first_token_seconds_p99']:.3f}\"\
          \n                break\n\n            status_label = {\n              \
          \  \"completed\": \"Completed\", \"failed\": \"Failed\",\n             \
          \   \"skipped\": \"Skipped\", \"crashed\": \"Crashed\",\n            }.get(t[\"\
          status\"], t[\"status\"])\n\n            lines.append(\n               \
          \ f\"| {t.get('index', '?')+1 if isinstance(t.get('index'), int) else '?'}\
          \ \"\n                f\"| {t.get('name', '?')} | {tokens} | {prof} \"\n\
          \                f\"| {status_label} | {dur} \"\n                f\"| {throughput}\
          \ | {latency_p99} | {ttft_p99} |\"\n            )\n        lines.append(\"\
          \")\n\n    # Redeployment summary\n    active_redeploys = [r for r in redeploys\
          \ if r.get(\"status\") != \"skipped\"]\n    if active_redeploys:\n     \
          \   lines.append(\"## Redeployments\\n\")\n        for r in active_redeploys:\n\
          \            idx = r.get(\"index\", \"?\")\n            st = r.get(\"status\"\
          , \"?\")\n            reason = r.get(\"reason\", \"\")\n            detail\
          \ = f\" ({reason})\" if reason else \"\"\n            lines.append(f\"-\
          \ Between test {idx} and {idx+1 if isinstance(idx, int) else '?'}: **{st}**{detail}\"\
          )\n        lines.append(\"\")\n\n    # Detailed metrics per completed test\n\
          \    for t in completed:\n        lines.append(f\"### {t.get('name', '?')}\
          \ (detailed)\\n\")\n        metrics = t.get(\"metrics\", {})\n        if\
          \ not metrics:\n            lines.append(\"_No detailed metrics available._\\\
          n\")\n            continue\n        lines.extend([\n            \"| Strategy\
          \ | Rate (req/s) | Concurrency | Throughput (tok/s) \"\n            \"|\
          \ Latency mean (s) | Latency p99 (s) | TTFT mean (s) \"\n            \"\
          | TTFT p99 (s) | ITL mean (s) | Error rate |\",\n            \"|----------|-------------|-------------|--------------------\"\
          \n            \"|--------------------|-----------------|---------------\"\
          \n            \"|--------------|--------------|------------|\",\n      \
          \  ])\n        for sname, sm in sorted(metrics.items()):\n            def\
          \ fmt(v):\n                return f\"{v:.4f}\" if isinstance(v, float) else\
          \ (\n                    str(v) if v is not None else \"-\"\n          \
          \      )\n            lines.append(\n                f\"| {sname} \"\n \
          \               f\"| {fmt(sm.get('request_rate'))} \"\n                f\"\
          | {fmt(sm.get('request_concurrency'))} \"\n                f\"| {fmt(sm.get('total_tokens_per_second'))}\
          \ \"\n                f\"| {fmt(sm.get('request_latency_seconds_mean'))}\
          \ \"\n                f\"| {fmt(sm.get('request_latency_seconds_p99'))}\
          \ \"\n                f\"| {fmt(sm.get('time_to_first_token_seconds_mean'))}\
          \ \"\n                f\"| {fmt(sm.get('time_to_first_token_seconds_p99'))}\
          \ \"\n                f\"| {fmt(sm.get('inter_token_latency_seconds_mean'))}\
          \ \"\n                f\"| {fmt(sm.get('error_rate'))} |\"\n           \
          \ )\n        lines.append(\"\")\n\n    # Failed / skipped / crashed details\n\
          \    for label, group in [(\"Failed\", failed), (\"Skipped\", skipped),\
          \ (\"Crashed\", crashed)]:\n        if group:\n            lines.append(f\"\
          ## {label} Tests\\n\")\n            for t in group:\n                lines.append(f\"\
          - **{t.get('name', '?')}**: {t.get('reason', '?')}\")\n            lines.append(\"\
          \")\n\n    # Access instructions\n    lines.extend([\n        \"## Accessing\
          \ Detailed Results\\n\",\n        f\"Results are stored on PVC **`{pvc_name}`**\
          \ under `/{run_id}/`.\\n\",\n        \"Each completed test directory contains:\"\
          ,\n        \"- `benchmarks.html` -- Interactive visual report\",\n     \
          \   \"- `benchmarks.json` -- Machine-readable results\",\n        \"- `benchmarks.csv`\
          \  -- Spreadsheet-compatible data\\n\",\n        \"```bash\",\n        \"\
          # Start a viewer pod\",\n        f\"oc run results-viewer --restart=Never\
          \ \\\\\",\n        f\"  --image=registry.access.redhat.com/ubi9/ubi-minimal:latest\
          \ \\\\\",\n        f\"  --overrides='{{\\\"spec\\\":{{\\\"containers\\\"\
          :[{{\\\"name\\\":\\\"v\\\",\"\n        f\"\\\"image\\\":\\\"registry.access.redhat.com/ubi9/ubi-minimal:latest\\\
          \",\"\n        f\"\\\"command\\\":[\\\"sleep\\\",\\\"3600\\\"],\"\n    \
          \    f\"\\\"volumeMounts\\\":[{{\\\"name\\\":\\\"r\\\",\\\"mountPath\\\"\
          :\\\"/results\\\"}}]}}],\"\n        f\"\\\"volumes\\\":[{{\\\"name\\\":\\\
          \"r\\\",\"\n        f\"\\\"persistentVolumeClaim\\\":{{\\\"claimName\\\"\
          :\\\"{pvc_name}\\\"}}}}]}}}}'\",\n        \"\",\n        \"# Copy results\
          \ locally\",\n        f\"oc cp results-viewer:/results/{run_id}/ ./{run_id}/\"\
          ,\n    ])\n    for t in completed:\n        lines.append(\n            f\"\
          # oc cp results-viewer:/results/{run_id}/{t['name']}/benchmarks.html \"\n\
          \            f\"./{t['name']}-report.html\"\n        )\n    lines.extend([\n\
          \        \"\",\n        \"oc delete pod results-viewer\",\n        \"```\"\
          ,\n        \"\",\n    ])\n\n    with open(final_report.path, \"w\") as f:\n\
          \        f.write(\"\\n\".join(lines))\n\n    # ---- Cleanup model ------------------------------------------------\n\
          \n    cleanup_status = \"not requested\"\n    if cleanup_configmap and cleanup_configmap.strip():\n\
          \        try:\n            from kubernetes import client, config as k8s_config\n\
          \            from kubernetes.dynamic import DynamicClient\n            import\
          \ yaml\n\n            k8s_config.load_incluster_config()\n            v1\
          \ = client.CoreV1Api()\n            cm = v1.read_namespaced_config_map(cleanup_configmap.strip(),\
          \ namespace)\n\n            yaml_content = None\n            for key, value\
          \ in (cm.data or {}).items():\n                if key.endswith((\".yaml\"\
          , \".yml\")):\n                    yaml_content = value\n              \
          \      break\n            if not yaml_content and cm.data:\n           \
          \     yaml_content = list(cm.data.values())[0]\n\n            if yaml_content:\n\
          \                resource = yaml.safe_load(yaml_content)\n             \
          \   dyn = DynamicClient(client.ApiClient())\n                api = dyn.resources.get(\n\
          \                    api_version=resource[\"apiVersion\"],\n           \

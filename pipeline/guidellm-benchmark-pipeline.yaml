# PIPELINE DEFINITION
# Name: guidellm-benchmark-pipeline
# Description: Sequential GuideLLM load tests with separate steps for each test and each redeployment. Supports up to 5 test slots, timeout-aware graceful exit, a final Markdown report, and model cleanup.
# Inputs:
#    cleanup_configmap: str [Default: '']
#    model_name: str [Default: 'glm5.2']
#    namespace: str [Default: 'guidellm-nightly']
#    redeploy_configmaps: str [Default: '[]']
#    test_configs: str [Default: '[{"name": "small-128-64", "prompt_tokens": 128, "output_tokens": 64, "duration": 120}, {"name": "medium-256-128", "prompt_tokens": 256, "output_tokens": 128, "duration": 120}, {"name": "large-512-256", "prompt_tokens": 512, "output_tokens": 256, "duration": 120}]']
#    timeout_minutes: int [Default: 120.0]
components:
  comp-exit-handler-1:
    dag:
      tasks:
        redeploy-model:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-redeploy-model
          dependentTasks:
          - run-single-test
          inputs:
            parameters:
              deadline_epoch:
                componentInputParameter: pipelinechannel--setup-run-deadline_epoch
              namespace:
                componentInputParameter: pipelinechannel--namespace
              redeploy_configmaps_json:
                componentInputParameter: pipelinechannel--redeploy_configmaps
              redeploy_index:
                runtimeValue:
                  constant: 0.0
              run_id:
                componentInputParameter: pipelinechannel--setup-run-run_id
          taskInfo:
            name: Redeploy 0
        redeploy-model-2:

              run_id:
                componentInputParameter: pipelinechannel--setup-run-run_id
              test_configs_json:
                componentInputParameter: pipelinechannel--test_configs
              test_index:
                runtimeValue:
                  constant: 4.0
          taskInfo:
            name: Test 4
    inputDefinitions:
      parameters:
        pipelinechannel--model_name:
          parameterType: STRING

pipelineInfo:
  description: Sequential GuideLLM load tests with separate steps for each test and
    each redeployment. Supports up to 5 test slots, timeout-aware graceful exit, a
    final Markdown report, and model cleanup.
  name: guidellm-benchmark-pipeline
root:
  dag:
    tasks:
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        dependentTasks:
        - setup-run
        inputs:
          parameters:
            pipelinechannel--model_name:
              componentInputParameter: model_name
            pipelinechannel--namespace:
              componentInputParameter: namespace
            pipelinechannel--redeploy_configmaps:
              componentInputParameter: redeploy_configmaps
            pipelinechannel--setup-run-deadline_epoch:
              taskOutputParameter:
                outputParameterKey: deadline_epoch
                producerTask: setup-run
            pipelinechannel--setup-run-run_id:
              taskOutputParameter:
                outputParameterKey: run_id
                producerTask: setup-run
            pipelinechannel--test_configs:
              componentInputParameter: test_configs
        taskInfo:
          name: exit-handler-1
      finalize-run:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-finalize-run
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            cleanup_configmap:
              componentInputParameter: cleanup_configmap
            namespace:
              componentInputParameter: namespace
            pvc_name:
              runtimeValue:
                constant: guidellm-benchmark-results
        taskInfo:
          name: Final Report & Cleanup
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
      setup-run:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-setup-run
        inputs:
          parameters:
            test_configs_json:
              componentInputParameter: test_configs
            timeout_minutes:
              componentInputParameter: timeout_minutes
        taskInfo:
          name: Setup
  inputDefinitions:
    parameters:
      cleanup_configmap:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      model_name:
        defaultValue: glm5.2
        isOptional: true
        parameterType: STRING
      namespace:
        defaultValue: guidellm-nightly
        isOptional: true
        parameterType: STRING
      redeploy_configmaps:
        defaultValue: '[]'
        isOptional: true
        parameterType: STRING
      test_configs:
        defaultValue: '[{"name": "small-128-64", "prompt_tokens": 128, "output_tokens":
          64, "duration": 120}, {"name": "medium-256-128", "prompt_tokens": 256, "output_tokens":
          128, "duration": 120}, {"name": "large-512-256", "prompt_tokens": 512, "output_tokens":
          256, "duration": 120}]'
        isOptional: true
        parameterType: STRING
      timeout_minutes:
        defaultValue: 120.0
        isOptional: true
        parameterType: NUMBER_INTEGER
